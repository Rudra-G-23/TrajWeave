[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trajweave"
version = "0.5.0"
description = "Local-first research substrate for coding-agent trajectory learning (data layer, read-only explorer, deterministic experience extraction)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Rudra Prasad Bhuyan", email = "rudra@algen.ai" }]
keywords = ["coding-agent", "trajectory", "codex", "claude-code", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]

# Stage 0-3 deliberately uses only the Python standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
trajweave = "trajweave.cli.main:main"

[project.urls]
Homepage = "https://github.com/Rudra-G-23/TrajWeave"

[tool.hatch.build.targets.wheel]
packages = ["src/trajweave"]
# The Stage 4 UI assets (src/trajweave/ui/static/*.{html,css,js}) are picked up
# automatically as package data by the `packages` entry above.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: end-to-end tests that build a temp git repo and run the import pipeline",
]
