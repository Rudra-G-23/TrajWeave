name: Feature request
description: Suggest a new capability or a change to existing behavior.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >
        TrajWeave is a local-first, opt-in, no-auto-apply research substrate.
        Proposals that keep that scope and its privacy guarantees are much
        easier to accept.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This fits TrajWeave's local-first, explicit-opt-in, human-in-the-loop scope.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and why is it hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should TrajWeave do? Include the CLI or API surface if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, examples, screenshots, or anything else that helps.
    validations:
      required: false
